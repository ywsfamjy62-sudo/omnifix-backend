<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniFix AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0b1120; color: #ffffff; display: flex; flex-direction: column; height: 100vh; }
    
    header { background-color: #172033; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #232f48; }
    .badge { background: #2563eb; color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 13px; }
    .title { font-weight: bold; font-size: 18px; color: #60a5fa; }
    
    .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    
    .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 15px; line-height: 1.5; word-wrap: break-word; }
    .message.user { background-color: #2563eb; align-self: flex-start; border-bottom-right-radius: 2px; }
    .message.bot { background-color: #1e293b; align-self: flex-end; border-bottom-left-radius: 2px; border: 1px solid #334155; }
    .message img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; }
    
    .preview-area { display: flex; gap: 10px; padding: 0 20px 10px; overflow-x: auto; }
    .preview-item { position: relative; width: 60px; height: 60px; border-radius: 8px; overflow: hidden; border: 1px solid #3b82f6; }
    .preview-item img { width: 100%; height: 100%; object-fit: cover; }
    
    .input-container { background-color: #172033; padding: 15px 20px; display: flex; gap: 10px; align-items: center; border-top: 1px solid #232f48; }
    input[type="text"] { flex: 1; background: #0f172a; border: 1px solid #334155; color: #fff; padding: 12px 15px; border-radius: 8px; outline: none; }
    input[type="text"]:focus { border-color: #2563eb; }
    
    .btn { background: #2563eb; border: none; color: white; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .btn:hover { background: #1d4ed8; }
    .file-btn { background: #334155; padding: 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    #fileInput { display: none; }
  </style>
</head>
<body>

  <header>
    <div class="badge">الباقة العادية 👑</div>
    <div class="title">OmniFix AI</div>
    <div style="font-size: 20px; cursor: pointer;">☰</div>
  </header>

  <div class="chat-container" id="chatContainer"></div>

  <div class="preview-area" id="previewArea"></div>

  <div class="input-container">
    <label class="file-btn" for="fileInput">➕</label>
    <input type="file" id="fileInput" multiple accept="image/*" onchange="handleFilesSelect(event)">
    <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button class="btn" onclick="sendMessage()">إرسال</button>
  </div>

  <script>
    let chats = JSON.parse(localStorage.getItem('omni_chats') || '[]');
    let currentChatId = null;
    let selectedFiles = [];

    const chatContainer = document.getElementById('chatContainer');
    const previewArea = document.getElementById('previewArea');

    function saveChats() {
      localStorage.setItem('omni_chats', JSON.stringify(chats));
    }

    function renderMediaPreview() {
      previewArea.innerHTML = '';
      selectedFiles.forEach((file, index) => {
        const div = document.createElement('div');
        div.className = 'preview-item';
        div.innerHTML = `<img src="${file.data}" /><span onclick="removeFile(${index})" style="position:absolute;top:0;right:0;background:red;color:white;padding:2px 5px;font-size:10px;cursor:pointer;">✕</span>`;
        previewArea.appendChild(div);
      });
    }

    function removeFile(index) {
      selectedFiles.splice(index, 1);
      renderMediaPreview();
    }

    // دالة ضغط الصور لتفادي قيود حجم Vercel
    function compressImage(file, maxWidth = 800, quality = 0.7) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve({
              data: canvas.toDataURL('image/jpeg', quality),
              type: 'image'
            });
          };
        };
      });
    }

    async function handleFilesSelect(event) {
      const files = Array.from(event.target.files);
      if (selectedFiles.length + files.length > 5) {
        alert('يمكنك رفع 5 صور كحد أقصى في المرة الواحدة.');
        return;
      }

      for (const file of files) {
        if (file.type.startsWith('image/')) {
          const compressed = await compressImage(file);
          selectedFiles.push(compressed);
        }
      }
      renderMediaPreview();
    }

    function appendMessageUI(text, sender, mediaList = []) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      msgDiv.innerText = text;

      if (mediaList && mediaList.length > 0) {
        mediaList.forEach(m => {
          const img = document.createElement('img');
          img.src = m.data;
          msgDiv.appendChild(img);
        });
      }

      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msgDiv;
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text && selectedFiles.length === 0) return;

      if (!currentChatId) {
        currentChatId = Date.now();
        chats.unshift({ id: currentChatId, title: text.substring(0, 15) || 'صورة مرفقة', messages: [] });
      }

      const activeChat = chats.find(c => c.id === currentChatId);
      const currentMediaList = [...selectedFiles];

      // إظهار رسالة المستخدم
      appendMessageUI(text, 'user', currentMediaList);
      activeChat.messages.push({ text, sender: 'user', mediaList: currentMediaList });
      saveChats();

      input.value = '';
      selectedFiles = [];
      renderMediaPreview();

      // إظهار نص جاري التفكير
      const loadingEl = appendMessageUI('جاري التفكير...', 'bot');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            message: text,
            mediaList: currentMediaList
          })
        });

        const data = await response.json();
        const replyText = data.reply || data.error || 'لم يتم استلام رد من الذكاء الاصطناعي.';
        
        loadingEl.innerText = replyText;
        activeChat.messages.push({ text: replyText, sender: 'bot' });
        saveChats();
      } catch (err) {
        console.error(err);
        loadingEl.innerText = '⚠️ متعذر الاتصال بالسيرفر. تحقق من حالة Vercel أو مفتاح الـ API.';
      }
    }
  </script>
</body>
</html>
