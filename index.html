<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OmniFix AI</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #161f30;
      --text-color: #f3f4f6;
      --text-sub: #9ca3af;
      --accent-color: #2563eb;
      --border-color: #2a364f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; height: 100vh; width: 100vw; overflow: hidden; }

    .main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; width: 100%; position: relative; }

    header {
      background-color: var(--card-bg); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border-color); height: 60px;
    }

    .display-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 20px; align-items: center; }

    /* تصميم واجهة الإجابات كبطاقات نتائج كاملة بدلاً من الفقاعات */
    .result-card {
      width: 100%; max-width: 800px; background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); margin-bottom: 10px;
    }

    .query-header {
      font-size: 15px; font-weight: bold; color: #60a5fa; border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;
    }

    .response-body {
      font-size: 15px; line-height: 1.7; color: var(--text-color); white-space: pre-wrap; word-break: break-word;
    }

    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; margin-bottom: 12px; }
    .media-grid img, .media-grid video { width: 100%; height: 90px; object-fit: cover; border-radius: 8px; }

    /* الإدخال */
    .input-container { 
      padding: 12px; background: var(--card-bg); border-top: 1px solid var(--border-color); 
      display: flex; gap: 8px; align-items: center;
    }
    .input-container input[type="text"] {
      flex: 1; padding: 14px; border-radius: 12px; border: 1px solid var(--border-color);
      background: var(--bg-color); color: var(--text-color); font-size: 15px; outline: none;
    }
    .input-container button { padding: 14px 20px; background: var(--accent-color); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
    
    #mediaPreviewArea { display: none; padding: 8px 12px; background: var(--card-bg); gap: 8px; overflow-x: auto; }
    .preview-item { position: relative; display: inline-block; }
    .preview-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
    .remove-btn { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="main-content">
    <header>
      <h3 style="font-size:18px;">OmniFix <span style="color:#2563eb;">Search & AI</span></h3>
    </header>

    <div class="display-container" id="displayContainer">
      <div class="result-card" style="text-align: center; color: var(--text-sub);">
        <h2>مرحباً بك في OmniFix AI</h2>
        <p style="margin-top: 8px;">اكتب أي سؤال أو استفسار للحصول على نتائج حية من Google والذكاء الاصطناعي مباشرة.</p>
      </div>
    </div>

    <div id="mediaPreviewArea"></div>

    <div class="input-container">
      <button style="background:rgba(255,255,255,0.1); color:white;" onclick="document.getElementById('fileInput').click()">📷</button>
      <input type="file" id="fileInput" accept="image/*,video/*" multiple style="display:none;" onchange="handleFilesSelect(event)">
      <input type="text" id="userInput" placeholder="ابحث أو اسأل عن أي شيء..." onkeydown="if(event.key==='Enter') sendQuery()">
      <button onclick="sendQuery()">بحث</button>
    </div>
  </div>

  <script>
    let selectedFiles = [];

    function handleFilesSelect(event) {
      const files = Array.from(event.target.files);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          selectedFiles.push({ data: e.target.result, type: 'image' });
          renderPreview();
        };
        reader.readAsDataURL(file);
      });
    }

    function renderPreview() {
      const area = document.getElementById('mediaPreviewArea');
      if (selectedFiles.length === 0) { area.style.display = 'none'; return; }
      area.style.display = 'flex';
      area.innerHTML = '';
      selectedFiles.forEach((file, index) => {
        area.innerHTML += `
          <div class="preview-item">
            <img src="${file.data}">
            <button class="remove-btn" onclick="selectedFiles.splice(${index},1); renderPreview();">✕</button>
          </div>
        `;
      });
    }

    async function sendQuery() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text && selectedFiles.length === 0) return;

      const userText = text;
      const mediaList = [...selectedFiles];

      input.value = '';
      selectedFiles = [];
      renderPreview();

      const container = document.getElementById('displayContainer');

      // إنشاء بطاقة النتيجة مباشرة بدلاً من فقاعة الدردشة
      const card = document.createElement('div');
      card.className = 'result-card';

      let mediaHTML = '';
      if (mediaList.length > 0) {
        mediaHTML = `<div class="media-grid">` + mediaList.map(m => `<img src="${m.data}">`).join('') + `</div>`;
      }

      card.innerHTML = `
        <div class="query-header">🔍 ${userText || 'تحليل الوسائط'}</div>
        ${mediaHTML}
        <div class="response-body" id="res-${Date.now()}">⏳ جاري البحث واستخراج الإجابة من Google...</div>
      `;

      container.appendChild(card);
      container.scrollTop = container.scrollHeight;

      const responseBox = card.querySelector('.response-body');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: userText, mediaList: mediaList })
        });

        const data = await res.json();
        responseBox.innerText = data.reply || '⚠️ تعذر الحصول على نتيجة.';
      } catch (err) {
        responseBox.innerText = '⚠️ خطأ في الاتصال بالسيرفر: ' + err.message;
      }
    }
  </script>
</body>
</html>
