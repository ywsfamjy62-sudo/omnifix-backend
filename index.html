<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OmniFix AI</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #161f30;
      --user-bubble: #1e3a8a;
      --text-color: #f3f4f6;
      --text-sub: #9ca3af;
      --accent-color: #2563eb;
      --border-color: #2a364f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; background-color: var(--bg-color); color: var(--text-color); overflow: hidden; }

    .app-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: relative; }

    /* الهيدر العلوي */
    header {
      background-color: var(--card-bg); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border-color); height: 60px; flex-shrink: 0; z-index: 10;
    }
    .badge-btn {
      background: #1e293b; color: #fbd38d; border: 1px solid #d69e2e;
      padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer;
    }
    .header-title { font-size: 18px; font-weight: bold; color: #2563eb; }
    .header-title span { color: #f3f4f6; }
    .menu-btn {
      background: #1e293b; color: #f3f4f6; border: 1px solid var(--border-color);
      padding: 8px 12px; border-radius: 8px; font-size: 18px; cursor: pointer;
    }

    /* منطقة عرض المحادثة */
    .chat-container { 
      flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 140px; 
      display: flex; flex-direction: column; gap: 18px; width: 100%; 
    }

    .welcome-card {
      width: 100%; background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 16px; padding: 30px 20px; text-align: center; margin: auto 0;
    }
    .welcome-card h2 { font-size: 22px; color: #38bdf8; margin-bottom: 10px; }
    .welcome-card p { font-size: 14px; color: var(--text-sub); line-height: 1.6; }

    /* فقاعة سؤال المستخدم (على اليسار) */
    .user-msg-wrapper { display: flex; justify-content: flex-start; width: 100%; }
    .user-msg-bubble {
      background: var(--user-bubble); border: 1px solid #3b82f6; border-radius: 16px 16px 0px 16px;
      padding: 12px 16px; max-width: 80%; color: #fff; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .user-msg-bubble img { max-width: 100%; border-radius: 10px; margin-top: 8px; display: block; }
    .msg-meta { font-size: 11px; color: #93c5fd; margin-bottom: 4px; font-weight: bold; }

    /* رد الذكاء الاصطناعي (مكتوب مباشرة على الشاشة بدون مستطيل) */
    .ai-response-text {
      width: 100%; font-size: 15px; line-height: 1.8; color: #f3f4f6;
      padding: 5px 10px; white-space: pre-wrap; word-break: break-word;
    }

    /* معاينة الصورة المحددة فوق شريط الإدخال */
    .image-preview-bar {
      display: none; padding: 8px 12px; background: #111827; border-top: 1px solid var(--border-color);
      align-items: center; gap: 10px; z-index: 99;
    }
    .image-preview-bar img { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; border: 1px solid var(--accent-color); }
    .remove-img-btn { background: #ef4444; color: white; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-size: 12px; }

    /* شريط الكتابة الإدخالي */
    .input-container { 
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 10px 12px 25px 12px; background: var(--card-bg); border-top: 1px solid var(--border-color); 
      display: flex; gap: 8px; align-items: center; z-index: 100;
    }
    .input-container input[type="text"] {
      flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border-color);
      background: var(--bg-color); color: var(--text-color); font-size: 14px; outline: none; text-align: right;
    }
    .btn-action {
      padding: 10px 16px; background: var(--accent-color); color: white; border: none;
      border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer;
    }
    .btn-plus { background: #1e293b; border: 1px solid var(--border-color); font-size: 18px; padding: 10px 14px; }

    /* نافذة الباقات (30 باقة) */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 999; justify-content: center; align-items: center; padding: 15px;
    }
    .modal-content {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px;
      padding: 20px; width: 100%; max-width: 440px; text-align: right; max-height: 85vh; overflow-y: auto;
    }
    .plan-card {
      background: #1e293b; border: 1px solid var(--border-color); border-radius: 12px;
      padding: 12px; margin-top: 10px; display: flex; flex-direction: column; gap: 6px;
    }
    .plan-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 14px; color: #38bdf8; }
    .plan-tags { display: flex; gap: 6px; }
    .ad-tag { background: #d97706; color: white; padding: 2px 6px; border-radius: 6px; font-size: 11px; }
    .time-tag { background: #059669; color: white; padding: 2px 6px; border-radius: 6px; font-size: 11px; }
    .plan-btn { width: 100%; margin-top: 6px; padding: 8px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

    /* القائمة الجانبية */
    .sidebar {
      position: fixed; top: 0; right: -300px; width: 280px; height: 100%;
      background: var(--card-bg); border-left: 1px solid var(--border-color);
      z-index: 999; transition: right 0.3s ease; padding: 20px 15px; display: flex; flex-direction: column;
    }
    .sidebar.open { right: 0; }
    .history-list { flex: 1; overflow-y: auto; margin-top: 15px; }
    .history-item { padding: 10px; background: #1e293b; border-radius: 8px; margin-bottom: 8px; font-size: 13px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <button class="badge-btn" id="currentPlanBtn">الباقة 1 (مجانية) 👑</button>
      <div class="header-title">OmniFix <span>AI</span></div>
      <button class="menu-btn" id="menuBtn">☰</button>
    </header>

    <div class="chat-container" id="chatContainer">
      <div class="welcome-card" id="welcomeCard">
        <h2>OmniFix AI</h2>
        <p>المساعد الذكي المتكامل للدردشة والمحادثة والنصوص والوسائط.</p>
      </div>
    </div>

    <!-- بار معاينة الصور المعلقة -->
    <div class="image-preview-bar" id="imagePreviewBar">
      <img id="previewImg" src="" alt="معاينة">
      <span style="font-size:12px; color:#9ca3af;">تم إرفاق صورة</span>
      <button class="remove-img-btn" id="removeImgBtn">✕</button>
    </div>

    <div class="input-container">
      <button class="btn-action" id="sendBtn">إرسال</button>
      <input type="text" id="userInput" placeholder="اكتب رسالتك هنا...">
      <button class="btn-action btn-plus" id="uploadBtn">+</button>
      <input type="file" id="fileInput" accept="image/*" style="display:none;">
    </div>
  </div>

  <!-- القائمة الجانبية -->
  <div class="sidebar" id="sidebar">
    <h3 style="color:#38bdf8;">سجل المحادثات 📜</h3>
    <div class="history-list" id="historyList"></div>
    <button class="btn-action" id="clearBtn" style="background:#ef4444; margin-top:10px;">مسح السجل 🗑️</button>
    <button class="btn-action" id="closeSidebarBtn" style="margin-top:8px; background:#4b5563;">إغلاق</button>
  </div>

  <!-- نافذة الباقات (30 باقة) -->
  <div class="modal" id="plansModal">
    <div class="modal-content">
      <h3 style="color:#f3f4f6; border-bottom:1px solid var(--border-color); padding-bottom:8px;">اختر من بين 30 باقة 👑</h3>
      <div id="plansList"></div>
      <button class="btn-action" id="closePlansBtn" style="width:100%; margin-top:15px; background:#4b5563;">إغلاق</button>
    </div>
  </div>

  <script>
    let chatHistory = JSON.parse(localStorage.getItem('omni_history') || '[]');
    let activePlan = 'الباقة 1';
    let selectedImageBase64 = null;

    // 1. إنشاء قائمة الـ 30 باقة ديناميكياً مع أوقات عشوائية وإعلانات متصاعدة
    const plansData = [
      "الباقة الأساسية", "باقة Unity 2D", "باقة Unity 3D", "باقة C# Advanced", "باقة Web HTML/CSS",
      "باقة Node.js Server", "باقة Express APIs", "باقة Python Code", "باقة كتابة المقالات", "باقة التعبير الإبداعي",
      "باقة تحليل الصور", "باقة الهندسة العكسية", "باقة تصميم الألعاب", "باقة UI/UX Mobile", "باقة قاعدة البيانات",
      "باقة الذكاء الاصطناعي", "باقة معالجة اللغات", "باقة أمن المعلومات", "باقة السكربتات", "باقة التسويق الرقمي",
      "باقة الترجمة الفورية", "باقة مراجعة الكود", "باقة تحسين الأداء", "باقة الدعم الفني", "باقة حل الخوارزميات",
      "باقة OmniFix Pro", "باقة OmniFix Max", "باقة OmniFix Ultra", "باقة الذكاء الخارق", "باقة OmniFix VIP"
    ];

    function generatePlans() {
      const container = document.getElementById('plansList');
      container.innerHTML = '';
      
      plansData.forEach((name, index) => {
        const id = index + 1;
        const adsCount = id; // عدد الإعلانات يساوي رقم الباقة
        // وقت التفعيل بين 12 و 48 ساعة بشكل متناسق عشوائي
        const hours = Math.floor(12 + ((id * 37) % 37)); 
        
        const card = document.createElement('div');
        card.className = 'plan-card';
        card.innerHTML = `
          <div class="plan-header">
            <span>باقة ${id}: ${name}</span>
            <div class="plan-tags">
              <span class="ad-tag">📺 ${adsCount} إعلان</span>
              <span class="time-tag">⏱️ ${hours} ساعة</span>
            </div>
          </div>
          <button class="plan-btn" onclick="triggerAdWatcher(${id}, '${name}', ${adsCount}, ${hours})">تفعيل الباقة</button>
        `;
        container.appendChild(card);
      });
    }

    // 2. محاكي عداد الإعلانات (مثال: 1/2 .. 2/2) وتفعيل الباقة
    function triggerAdWatcher(id, name, totalAds, hours) {
      let currentAd = 0;
      
      function watchNextAd() {
        currentAd++;
        alert(`مشاهدة الإعلان (${currentAd}/${totalAds})...`);
        
        if (currentAd < totalAds) {
          setTimeout(watchNextAd, 400);
        } else {
          alert(`🎉 مبروك! تم مشاهدة جميع الإعلانات (${totalAds}/${totalAds}).\nتم تفعيل [باقة ${id}: ${name}] بنجاح لمدة ${hours} ساعة!`);
          activePlan = `باقة ${id}`;
          document.getElementById('currentPlanBtn').innerText = `باقة ${id} 👑`;
          document.getElementById('plansModal').style.display = 'none';
        }
      }
      
      watchNextAd();
    }

    // 3. إدارة اختيار الصور ومعاينتها
    document.getElementById('uploadBtn').addEventListener('click', () => document.getElementById('fileInput').click());
    
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          selectedImageBase64 = evt.target.result;
          document.getElementById('previewImg').src = selectedImageBase64;
          document.getElementById('imagePreviewBar').style.display = 'flex';
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('removeImgBtn').addEventListener('click', () => {
      selectedImageBase64 = null;
      document.getElementById('fileInput').value = '';
      document.getElementById('imagePreviewBar').style.display = 'none';
    });

    // 4. إرسال المحادثة وعرض النتائج
    document.getElementById('sendBtn').addEventListener('click', sendQuery);
    document.getElementById('userInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendQuery(); });

    async function sendQuery() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text && !selectedImageBase64) return;

      const container = document.getElementById('chatContainer');
      const welcomeCard = document.getElementById('welcomeCard');
      if (welcomeCard) welcomeCard.style.display = 'none';

      // عرض فقاعة سؤال المستخدم على الجانب الأيسر
      const userWrapper = document.createElement('div');
      userWrapper.className = 'user-msg-wrapper';
      
      let imgHTML = selectedImageBase64 ? `<img src="${selectedImageBase64}" />` : '';
      userWrapper.innerHTML = `
        <div class="user-msg-bubble">
          <div class="msg-meta">السؤال (${activePlan})</div>
          <div>${text}</div>
          ${imgHTML}
        </div>
      `;
      container.appendChild(userWrapper);

      // تفريغ المدخلات والصورة المعلقة
      const currentImg = selectedImageBase64;
      input.value = '';
      selectedImageBase64 = null;
      document.getElementById('imagePreviewBar').style.display = 'none';

      // عنصر كتابة الإجابة المباشرة للذكاء الاصطناعي (بدون مستطيل)
      const aiResponse = document.createElement('div');
      aiResponse.className = 'ai-response-text';
      aiResponse.innerText = '⏳ جاري المعالجة...';
      container.appendChild(aiResponse);

      container.scrollTop = container.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, plan: activePlan, image: currentImg })
        });

        const data = await res.json();
        const reply = data.reply || '⚠️ لم تصل إجابة من السيرفر.';
        aiResponse.innerText = reply;

        chatHistory.push({ title: text || 'صورة مرفقة', reply: reply });
        localStorage.setItem('omni_history', JSON.stringify(chatHistory));

      } catch (err) {
        aiResponse.innerText = '⚠️ خطأ في الاتصال: ' + err.message;
      }
    }

    // 5. ربط عناصر الواجهة والقائمة الجانبية
    document.getElementById('currentPlanBtn').addEventListener('click', () => {
      document.getElementById('plansModal').style.display = 'flex';
    });
    document.getElementById('closePlansBtn').addEventListener('click', () => {
      document.getElementById('plansModal').style.display = 'none';
    });
    document.getElementById('menuBtn').addEventListener('click', toggleSidebar);
    document.getElementById('closeSidebarBtn').addEventListener('click', toggleSidebar);

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      renderHistory();
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      chatHistory.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerText = item.title;
        div.onclick = () => loadChat(idx);
        list.appendChild(div);
      });
    }

    document.getElementById('clearBtn').addEventListener('click', () => {
      localStorage.removeItem('omni_history');
      chatHistory = [];
      renderHistory();
      alert('تم مسح سجل المحادثات.');
    });

    function loadChat(idx) {
      const item = chatHistory[idx];
      if (!item) return;
      const container = document.getElementById('chatContainer');
      container.innerHTML = '';

      const userWrapper = document.createElement('div');
      userWrapper.className = 'user-msg-wrapper';
      userWrapper.innerHTML = `<div class="user-msg-bubble">${item.title}</div>`;
      container.appendChild(userWrapper);

      const aiResponse = document.createElement('div');
      aiResponse.className = 'ai-response-text';
      aiResponse.innerText = item.reply;
      container.appendChild(aiResponse);

      toggleSidebar();
    }

    // تشغيل القوائم عند الفتح
    generatePlans();
  </script>
</body>
</html>
