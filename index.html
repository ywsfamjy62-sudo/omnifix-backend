<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniFix AI</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --chat-bg: #1e293b;
      --text-color: #f8fafc;
      --user-msg: #2563eb;
      --bot-msg: #334155;
      --sidebar-bg: #020617;
      --border-color: #475569;
    }

    .light-mode {
      --bg-color: #f1f5f9;
      --chat-bg: #ffffff;
      --text-color: #0f172a;
      --user-msg: #2563eb;
      --bot-msg: #e2e8f0;
      --sidebar-bg: #cbd5e1;
      --border-color: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; height: 100vh; overflow: hidden; }

    /* القائمة الجانبية */
    .sidebar {
      width: 260px;
      background-color: var(--sidebar-bg);
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      position: fixed;
      top: 0; bottom: 0; right: -260px;
      transition: right 0.3s ease;
      z-index: 1000;
      border-left: 1px solid var(--border-color);
    }
    body.ltr .sidebar { right: auto; left: -260px; transition: left 0.3s ease; border-left: none; border-right: 1px solid var(--border-color); }
    .sidebar.open { right: 0; }
    body.ltr .sidebar.open { left: 0; }

    .sidebar button {
      background: var(--user-msg);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    /* المنطقة الرئيسية */
    .main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; width: 100%; }
    
    header {
      background-color: var(--chat-bg);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .icon-btn { background: none; border: 1px solid var(--border-color); color: var(--text-color); padding: 6px 12px; border-radius: 6px; cursor: pointer; }

    .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; word-break: break-word; }
    .user { background-color: var(--user-msg); color: white; align-self: flex-end; }
    .bot { background-color: var(--bot-msg); color: var(--text-color); align-self: flex-start; }
    .message img { max-width: 100%; border-radius: 8px; margin-top: 8px; }

    /* منطقة الإدخال */
    .input-box { padding: 15px; background-color: var(--chat-bg); display: flex; gap: 10px; border-top: 1px solid var(--border-color); }
    .input-box input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); }
    .input-box button { padding: 12px 20px; background: var(--user-msg); color: white; border: none; border-radius: 8px; cursor: pointer; }

    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; z-index: 999; }
    .overlay.active { display: block; }
  </style>
</head>
<body>

  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <!-- القائمة الجانبية -->
  <div class="sidebar" id="sidebar">
    <h2 id="menu-title">القائمة</h2>
    <button onclick="newChat()" id="new-chat-btn">+ محادثة جديدة</button>
    <div style="flex:1;"></div>
    <button onclick="toggleTheme()" class="icon-btn" id="theme-btn">🌙 الوضع الليلي</button>
    <button onclick="toggleLang()" class="icon-btn" id="lang-btn">🌐 English</button>
  </div>

  <!-- الواجهة الرئيسية -->
  <div class="main-content">
    <header>
      <button class="icon-btn" onclick="toggleSidebar()">☰</button>
      <h2>OmniFix AI</h2>
      <div></div>
    </header>

    <div class="chat-box" id="chatBox">
      <div class="message bot" id="welcome-msg">مرحباً بك! كيف يمكنني مساعدتك اليوم؟ (يمكنك قولي "ارسم صورة لـ..." لتوليد صور)</div>
    </div>

    <div class="input-box">
      <input type="text" id="userInput" placeholder="اكتب رسالتك أو طلب الرسم..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()" id="send-btn">إرسال</button>
    </div>
  </div>

  <script>
    let currentLang = 'ar';

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('active');
    }

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      const isLight = document.body.classList.contains('light-mode');
      document.getElementById('theme-btn').innerText = isLight ? '☀️ الوضع النهاري' : '🌙 الوضع الليلي';
    }

    function toggleLang() {
      if (currentLang === 'ar') {
        currentLang = 'en';
        document.documentElement.dir = 'ltr';
        document.body.classList.add('ltr');
        document.getElementById('lang-btn').innerText = '🌐 العربية';
        document.getElementById('menu-title').innerText = 'Menu';
        document.getElementById('new-chat-btn').innerText = '+ New Chat';
        document.getElementById('userInput').placeholder = 'Type a message or "draw..."';
        document.getElementById('send-btn').innerText = 'Send';
        document.getElementById('welcome-msg').innerText = 'Welcome! How can I help you today? (Say "draw a..." to generate images)';
      } else {
        currentLang = 'ar';
        document.documentElement.dir = 'rtl';
        document.body.classList.remove('ltr');
        document.getElementById('lang-btn').innerText = '🌐 English';
        document.getElementById('menu-title').innerText = 'القائمة';
        document.getElementById('new-chat-btn').innerText = '+ محادثة جديدة';
        document.getElementById('userInput').placeholder = 'اكتب رسالتك أو طلب الرسم...';
        document.getElementById('send-btn').innerText = 'إرسال';
        document.getElementById('welcome-msg').innerText = 'مرحباً بك! كيف يمكنني مساعدتك اليوم؟ (يمكنك قولي "ارسم صورة لـ..." لتوليد صور)';
      }
    }

    function newChat() {
      document.getElementById('chatBox').innerHTML = `<div class="message bot">${currentLang === 'ar' ? 'محادثة جديدة جارية...' : 'New chat started...'}</div>`;
      toggleSidebar();
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');
      
      chatBox.innerHTML += `<div class="message user">${text}</div>`;
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      const loadingId = 'loading-' + Date.now();
      chatBox.innerHTML += `<div class="message bot" id="${loadingId}">${currentLang === 'ar' ? 'جاري التفكير...' : 'Thinking...'}</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await response.json();
        
        const loadingEl = document.getElementById(loadingId);
        if (data.isImage) {
          loadingEl.innerHTML = `<img src="${data.imageUrl}" alt="Generated Image">`;
        } else {
          loadingEl.innerText = data.reply;
        }
      } catch (err) {
        document.getElementById(loadingId).innerText = currentLang === 'ar' ? 'حدث خطأ في الاتصال.' : 'Connection error.';
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
