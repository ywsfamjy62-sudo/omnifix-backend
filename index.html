<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OmniFix AI</title>
  <style>
    :root {
      --bg-color: #090d16;
      --chat-bg: #111827;
      --card-bg: #1f2937;
      --text-color: #f3f4f6;
      --text-sub: #9ca3af;
      --accent-color: #2563eb;
      --user-msg: #2563eb;
      --bot-msg: #1f2937;
      --sidebar-bg: #0d1322;
      --border-color: #374151;
    }

    .light-mode {
      --bg-color: #f3f4f6;
      --chat-bg: #ffffff;
      --card-bg: #ffffff;
      --text-color: #111827;
      --text-sub: #4b5563;
      --accent-color: #2563eb;
      --user-msg: #2563eb;
      --bot-msg: #e5e7eb;
      --sidebar-bg: #e5e7eb;
      --border-color: #d1d5db;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; height: 100vh; width: 100vw; overflow: hidden; }

    /* القائمة الجانبية */
    .sidebar {
      width: 280px; max-width: 80vw; background-color: var(--sidebar-bg); padding: 15px; display: flex; flex-direction: column; gap: 15px;
      position: fixed; top: 0; bottom: 0; right: -100%; transition: right 0.3s ease; z-index: 1001; border-left: 1px solid var(--border-color);
    }
    .sidebar.open { right: 0; }

    .new-btn {
      background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: none; padding: 12px; border-radius: 10px;
      cursor: pointer; font-weight: bold; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .history-item-container { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 10px; }
    .history-item { flex: 1; cursor: pointer; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .delete-btn { background: none; border: none; color: #ef4444; cursor: pointer; padding: 4px; font-size: 16px; }

    /* الواجهة الرئيسية */
    .main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; width: 100%; position: relative; }

    header {
      background-color: var(--chat-bg); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border-color); height: 60px;
    }

    .icon-btn { background: rgba(255,255,255,0.08); border: 1px solid var(--border-color); color: var(--text-color); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; }

    .chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }

    .hero-welcome { margin: auto; text-align: center; max-width: 90%; padding: 20px; background: var(--card-bg); border-radius: 15px; border: 1px solid var(--border-color); }
    .hero-welcome h1 { font-size: 24px; color: #3b82f6; margin-bottom: 8px; }
    .hero-welcome p { color: var(--text-sub); font-size: 14px; }

    .message { max-width: 85%; padding: 12px 16px; border-radius: 14px; line-height: 1.5; font-size: 14px; word-break: break-word; }
    .user { background-color: var(--user-msg); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .bot { background-color: var(--bot-msg); color: var(--text-color); align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid var(--border-color); }

    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; margin-top: 8px; }
    .media-grid img, .media-grid video { width: 100%; height: 70px; object-fit: cover; border-radius: 6px; }

    /* معاينة المرفقات */
    #mediaPreviewArea { display: none; padding: 10px; background: var(--chat-bg); border-top: 1px solid var(--border-color); gap: 8px; overflow-x: auto; }
    .preview-item { position: relative; display: inline-block; flex-shrink: 0; }
    .preview-item img, .preview-item video { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; }
    .remove-media { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; cursor: pointer; }

    /* شريط كتابة مرفوع للأعلى لتجنب أزرار الموبايل */
    .input-container { 
      padding: 10px 12px 30px 12px; 
      padding-bottom: calc(25px + env(safe-area-inset-bottom, 0px)); 
      background: var(--chat-bg); 
      border-top: 1px solid var(--border-color); 
      display: flex; 
      gap: 8px; 
      align-items: center; 
    }
    .input-container input[type="text"] { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); font-size: 14px; outline: none; }
    .input-container button { padding: 12px 18px; background: var(--accent-color); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    .add-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--border-color); color: var(--text-color); padding: 8px 14px; border-radius: 10px; font-size: 20px; cursor: pointer; }

    /* نافذة الباقات مع العداد */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 10px; }
    .modal.active { display: flex; }
    .modal-content { background: #0f172a; width: 100%; max-width: 500px; padding: 20px; border-radius: 18px; border: 1px solid var(--border-color); max-height: 85vh; overflow-y: auto; }
    
    .plans-list { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
    
    .plan-card-v2 {
      background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 15px;
      display: flex; flex-direction: column; gap: 8px; text-align: right; position: relative;
    }
    .plan-card-v2.active-plan { border: 2px solid #10b981; background: rgba(16, 185, 129, 0.05); }
    .plan-card-v2 .badge-ad { position: absolute; top: 15px; left: 15px; background: rgba(59, 130, 246, 0.2); color: #60a5fa; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .plan-card-v2 .plan-title { font-size: 16px; font-weight: bold; color: #ffffff; display: flex; align-items: center; gap: 8px; }
    .plan-card-v2 .plan-desc { font-size: 13px; color: #94a3b8; line-height: 1.4; }
    .plan-card-v2 .plan-timer { font-size: 12px; color: #f59e0b; font-weight: bold; display: flex; align-items: center; gap: 5px; }
    
    .plan-act-btn {
      margin-top: 5px; width: 100%; padding: 10px; border: none; border-radius: 8px;
      background: #2563eb; color: white; font-weight: bold; cursor: pointer; font-size: 14px;
      display: flex; justify-content: center; align-items: center; gap: 6px;
    }
    .plan-act-btn.active { background: #10b981; }

    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; z-index: 1000; }
    .overlay.active { display: block; }
  </style>
</head>
<body>

  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <!-- القائمة الجانبية -->
  <div class="sidebar" id="sidebar">
    <button class="new-btn" onclick="startNewChat()"><span>+</span> محادثة جديدة</button>
    <div style="font-size:12px; color:var(--text-sub);">سجل المحادثات:</div>
    <div class="history-list" id="historyList"></div>

    <button onclick="openPlans()" class="icon-btn" style="background: #eab308; color:black;">👑 باقات الذكاء الأصطناعي (30)</button>
    <button onclick="toggleTheme()" class="icon-btn" id="lbl-theme">🌙 الوضع الليلي</button>
  </div>

  <!-- الشاشة الرئيسية -->
  <div class="main-content">
    <header>
      <button class="icon-btn" onclick="toggleSidebar()">☰</button>
      <h3 style="font-size:16px;">OmniFix <span style="color:#2563eb;">AI</span></h3>
      <button onclick="openPlans()" class="icon-btn">👑 <span id="lbl-top-plan">الباقة العادية</span></button>
    </header>

    <div class="chat-container" id="chatContainer">
      <div class="hero-welcome" id="heroWelcome">
        <h1>OmniFix AI</h1>
        <p>المساعد الذكي المتكامل للدردشة والمحادثة والنصوص والوسائط.</p>
      </div>
    </div>

    <!-- شريط معاينة المرفقات -->
    <div id="mediaPreviewArea"></div>

    <div class="input-container">
      <button class="add-btn" title="إرفاق صور/فيديوهات (حتى 20)" onclick="document.getElementById('fileInput').click()">+</button>
      <input type="file" id="fileInput" accept="image/*,video/*" multiple style="display:none;" onchange="handleFilesSelect(event)">
      <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()" id="sendBtn">إرسال</button>
    </div>
  </div>

  <!-- نافذة الباقات -->
  <div class="modal" id="plansModal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid #334155; padding-bottom:10px;">
        <h3 style="font-size:16px; color:#38bdf8;">💎 باقات قوة الذكاء الاصطناعي</h3>
        <button onclick="closePlans()" class="icon-btn">إغلاق</button>
      </div>
      <div class="plans-list" id="plansList"></div>
    </div>
  </div>

  <script>
    let chats = JSON.parse(localStorage.getItem('omnifix_chats') || '[]');
    let currentChatId = null;
    let selectedFiles = []; 
    let activePlanId = localStorage.getItem('omnifix_active_plan') || 1;
    let planExpiry = localStorage.getItem('omnifix_plan_expiry') || null;

    let adCounters = JSON.parse(localStorage.getItem('omnifix_ad_counters') || '{}');

    const plansData = [
      { id: 1, title: "الباقة العادية", desc: "إجابات أصلية أساسية وبسيطة لكل الأسئلة.", ads: 0, hours: 0, icon: "💎" },
      { id: 2, title: "باقة الدقة المتقدمة", desc: "رفع دقة الإجابات وتنسيق أفضل للردود والشروحات.", ads: 1, hours: 24, icon: "🎯" },
      { id: 3, title: "باقة المبرمج الذكي", desc: "توليد أكواد C# أو HTML أو JS بدون أي أخطاء.", ads: 2, hours: 24, icon: "💻" },
      { id: 4, title: "باقة السرعة الخارقة", desc: "إجابات سريعة جداً بدون انتظار مع فهم أعمق للصور.", ads: 3, hours: 24, icon: "🚀" },
      { id: 5, title: "باقة التفكير العميق", desc: "حل البرمجيات المعقدة والتحليل الرياضي والمنطقي المفصل.", ads: 4, hours: 24, icon: "🧠" },
      { id: 6, title: "باقة مطور الألعاب Unity (Expert)", desc: "بناء وتصميم سكربتات Unity وإحصائيات المراحل والمجسمات بدقة عالية.", ads: 5, hours: 48, icon: "🎮" },
      { id: 7, title: "باقة الاستجابة اللحظية", desc: "أقصى معدل ضغط واستجابة سريعة للبيانات والردود الطويلة.", ads: 6, hours: 48, icon: "⚡" },
      { id: 8, title: "باقة الفحص الخارق", desc: "معالجة وتحليل ما يزيد عن 20 صورة مرفقة بذكاء فائق.", ads: 7, hours: 48, icon: "🔥" },
      { id: 9, title: "باقة الذكاء الشامل", desc: "دمج مميزات الأكواد السريعة والتحليل العميق في باقة واحدة.", ads: 8, hours: 48, icon: "🌌" },
      { id: 10, title: "باقة (Ultimate AI)", desc: "أداء استثنائي متكامل لتطوير المواقع والتطبيقات والألعاب.", ads: 9, hours: 48, icon: "🔥" },
      { id: 11, title: "باقة الملك Google VIP (Power)", desc: "القوة القسوى الشاملة: دمج كافة قدرات المساعد وبأسرع أداء ممكن!", ads: 10, hours: 48, icon: "👑" }
    ];

    for (let i = 12; i <= 30; i++) {
      plansData.push({
        id: i,
        title: `باقة التطوير الفائق Level ${i}`,
        desc: `تفعيل قدرات سرعة وفحص متقدمة Level ${i} مع أداء مفتوح.`,
        ads: i,
        hours: i > 15 ? 48 : 24,
        icon: "⚡"
      });
    }

    function renderPlans() {
      const list = document.getElementById('plansList');
      list.innerHTML = '';

      plansData.forEach(plan => {
        const isActive = activePlanId == plan.id;
        const currentProgress = adCounters[plan.id] || 0;

        const card = document.createElement('div');
        card.className = `plan-card-v2 ${isActive ? 'active-plan' : ''}`;

        let timerHTML = '';
        if (isActive && planExpiry) {
          timerHTML = `<div class="plan-timer">⏳ المتبقي على انتهاء التفعيل: <span id="countdownTimer">--:--:--</span></div>`;
        } else if (plan.hours > 0) {
          timerHTML = `<div class="plan-timer">⏱️ مدة التفعيل: ${plan.hours} ساعة</div>`;
        }

        let buttonText = '';
        if (isActive) {
          buttonText = '✅ الباقة المفعلة حالياً';
        } else if (plan.ads === 0) {
          buttonText = 'تفعيل مجاناً';
        } else {
          buttonText = `🎬 مشاهدة إعلان (${currentProgress}/${plan.ads})`;
        }

        card.innerHTML = `
          <div class="badge-ad">${plan.ads === 0 ? 'مجاناً' : `${plan.ads} إعلان`}</div>
          <div class="plan-title">${plan.icon} ${plan.title}</div>
          <div class="plan-desc">${plan.desc}</div>
          ${timerHTML}
          <button class="plan-act-btn ${isActive ? 'active' : ''}" onclick="handlePlanClick(${plan.id}, ${plan.ads}, ${plan.hours})">
            ${buttonText}
          </button>
        `;
        list.appendChild(card);
      });

      updateTopPlanLabel();
    }

    function handlePlanClick(planId, requiredAds, hours) {
      if (activePlanId == planId) return;

      if (requiredAds === 0) {
        activatePlan(planId, hours);
        return;
      }

      let currentProgress = adCounters[planId] || 0;
      currentProgress++;
      adCounters[planId] = currentProgress;
      localStorage.setItem('omnifix_ad_counters', JSON.stringify(adCounters));

      if (typeof window.showAd === 'function') {
        window.showAd(); 
      } else {
        alert(`🎬 تم تسجيل مشاهدة الإعلان! العداد الحالي: (${currentProgress}/${requiredAds})`);
      }

      if (currentProgress >= requiredAds) {
        adCounters[planId] = 0;
        localStorage.setItem('omnifix_ad_counters', JSON.stringify(adCounters));
        activatePlan(planId, hours);
      } else {
        renderPlans();
      }
    }

    function activatePlan(planId, hours) {
      activePlanId = planId;
      localStorage.setItem('omnifix_active_plan', planId);

      if (hours > 0) {
        const expiryTime = Date.now() + (hours * 3600 * 1000);
        localStorage.setItem('omnifix_plan_expiry', expiryTime);
        planExpiry = expiryTime;
      } else {
        localStorage.removeItem('omnifix_plan_expiry');
        planExpiry = null;
      }

      renderPlans();
      startTimer();
      alert('🎉 مبروك! اكتمل العداد وتم تفعيل الباقة بنجاح!');
    }

    function updateTopPlanLabel() {
      const activeObj = plansData.find(p => p.id == activePlanId);
      if (activeObj) {
        document.getElementById('lbl-top-plan').innerText = activeObj.title;
      }
    }

    function startTimer() {
      setInterval(() => {
        if (!planExpiry) return;
        const now = Date.now();
        const diff = planExpiry - now;

        const timerEl = document.getElementById('countdownTimer');
        if (diff <= 0) {
          activePlanId = 1;
          localStorage.setItem('omnifix_active_plan', 1);
          localStorage.removeItem('omnifix_plan_expiry');
          planExpiry = null;
          renderPlans();
          return;
        }

        if (timerEl) {
          const hrs = Math.floor(diff / (1000 * 60 * 60));
          const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          const secs = Math.floor((diff % (1000 * 60)) / 1000);
          timerEl.innerText = `${hrs} س : ${mins} د : ${secs} ث`;
        }
      }, 1000);
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('active');
    }

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      const isLight = document.body.classList.contains('light-mode');
      document.getElementById('lbl-theme').innerText = isLight ? "☀️ الوضع النهاري" : "🌙 الوضع الليلي";
    }

    function openPlans() { document.getElementById('plansModal').classList.add('active'); renderPlans(); }
    function closePlans() { document.getElementById('plansModal').classList.remove('active'); }

    function startNewChat() {
      currentChatId = Date.now();
      chats.unshift({ id: currentChatId, title: 'محادثة جديدة', messages: [] });
      saveChats(); renderHistory(); clearChatBox();
      if (document.getElementById('sidebar').classList.contains('open')) toggleSidebar();
    }

    function clearChatBox() {
      document.getElementById('chatContainer').innerHTML = `
        <div class="hero-welcome" id="heroWelcome">
          <h1>OmniFix AI</h1>
          <p>المساعد الذكي المتكامل للدردشة والمحادثة والنصوص والوسائط.</p>
        </div>
      `;
    }

    function saveChats() { localStorage.setItem('omnifix_chats', JSON.stringify(chats)); }

    function renderHistory() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      chats.forEach(chat => {
        const itemContainer = document.createElement('div');
        itemContainer.className = 'history-item-container';
        itemContainer.innerHTML = `
          <div class="history-item" onclick="loadChat(${chat.id})">${chat.title}</div>
          <button class="delete-btn" onclick="deleteChat(event, ${chat.id})">🗑️</button>
        `;
        list.appendChild(itemContainer);
      });
    }

    function deleteChat(e, id) {
      e.stopPropagation();
      chats = chats.filter(c => c.id !== id);
      saveChats(); renderHistory();
      if (currentChatId === id) {
        if (chats.length > 0) loadChat(chats[0].id);
        else startNewChat();
      }
    }

    function loadChat(id) {
      currentChatId = id;
      const chat = chats.find(c => c.id === id);
      if (!chat) return;
      clearChatBox();
      const hero = document.getElementById('heroWelcome');
      if (hero && chat.messages.length > 0) hero.style.display = 'none';

      chat.messages.forEach(msg => appendMessageUI(msg.text, msg.sender, msg.mediaList));
      if (document.getElementById('sidebar').classList.contains('open')) toggleSidebar();
    }

    function handleFilesSelect(event) {
      const files = Array.from(event.target.files);
      if (selectedFiles.length + files.length > 20) {
        alert('الحد الأقصى المسموح به هو 20 ملفاً فقط!');
        return;
      }

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          selectedFiles.push({
            data: e.target.result,
            type: file.type.startsWith('image/') ? 'image' : 'video'
          });
          renderMediaPreview();
        };
        reader.readAsDataURL(file);
      });
    }

    function renderMediaPreview() {
      const area = document.getElementById('mediaPreviewArea');
      if (selectedFiles.length === 0) {
        area.style.display = 'none';
        return;
      }
      area.style.display = 'flex';
      area.innerHTML = '';
      selectedFiles.forEach((file, index) => {
        const item = document.createElement('div');
        item.className = 'preview-item';
        item.innerHTML = `
          ${file.type === 'image' ? `<img src="${file.data}">` : `<video src="${file.data}"></video>`}
          <button class="remove-media" onclick="removeSelectedMedia(${index})">✕</button>
        `;
        area.appendChild(item);
      });
    }

    function removeSelectedMedia(index) {
      selectedFiles.splice(index, 1);
      renderMediaPreview();
    }

    function appendMessageUI(text, sender, mediaList = []) {
      const chatContainer = document.getElementById('chatContainer');
      const hero = document.getElementById('heroWelcome');
      if (hero) hero.style.display = 'none';

      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      msgDiv.innerTex
